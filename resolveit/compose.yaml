services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - resolveit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  resolveit-postgres-data:
